      status("\u4E0A\u6B21\u7684 JSON \u9700\u8981\u91CD\u65B0\u6388\u6B0A\u3002\u53EF\u6309\u4E0B\u65B9\u7E7C\u7E8C\u8B80\u53D6\uFF0C\u6216\u7528\u300C\u5F00\u542F\u73B0\u6709\u8D44\u6599 JSON\u300D\u91CD\u65B0\u9078\u6A94\u3002");
      const button = el("button", "\u7E7C\u7E8C\u8B80\u53D6\u4E0A\u6B21\u8CC7\u6599");
      button.onclick = () => run(() => resume(true), "resume-data");
      $("status").append(button);
    } else if (next) {
      data = next;
      dirty = false;
      render();
      status("\u5DF2\u5F9E\u4E0A\u6B21\u6388\u6B0A\u7684\u5BE6\u9AD4 JSON \u8B80\u53D6\u6700\u65B0\u8CC7\u6599\u3002");
    } else status("\u8ACB\u7528\u300C\u5F00\u542F\u73B0\u6709\u8D44\u6599 JSON\u300D\u9078\u53D6\u8CC7\u6599\uFF1B\u6210\u529F\u5F8C\u6703\u5617\u8A66\u8A18\u4F4F\u6A94\u6848\u4F9B\u4E0B\u6B21\u4F7F\u7528\u3002");
  }
  void run(() => resume(), "resume-data");
})();
</script></body></html>
